<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a3dd0">
<title>포스터 생성기 · NOSONG</title>
<style>
  :root{--brand:#7a3dd0; --brand2:#b06bff; --bg:#f8f4ff; --card:#fff;
    --ink:#20152e; --sub:#6c5b85; --line:#e7dcf6;}
  @media (prefers-color-scheme:dark){
    :root{--bg:#120a1c; --card:#1c1329; --ink:#efe7f8; --sub:#ad9ac9; --line:#2f2242;}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;}
  .top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--brand),var(--brand2));
    color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.15);}
  .top a{color:#fff;text-decoration:none;font-size:20px;} .top h1{margin:0;font-size:17px;font-weight:800;}
  .wrap{max-width:520px;margin:0 auto;padding:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
  label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:10px 0 5px;}
  input,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px;font-family:inherit;}
  .seg{display:flex;gap:8px;flex-wrap:wrap;}
  .seg button{flex:1;min-width:70px;padding:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font-weight:700;cursor:pointer;font-size:13px;}
  .seg button.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;background:var(--brand);color:#fff;}
  .btn.sec{background:var(--card);color:var(--brand);border:1.5px solid var(--brand);}
  .up{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--sub);font-size:14px;cursor:pointer;}
  canvas{width:100%;border-radius:14px;display:block;box-shadow:0 6px 18px rgba(0,0,0,.18);}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;}
  .sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);}
  .sw.on{box-shadow:0 0 0 3px var(--brand);}
  .hint{font-size:12px;color:var(--sub);margin-top:8px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#20152e;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;z-index:9;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="top"><a href="index.html">←</a><h1>🖼️ 포스터 생성기</h1></div>
<div class="wrap">

  <div class="card">
    <div class="up" id="drop">📷 사진을 선택하세요<br><span style="font-size:12px">탭해서 앨범에서 고르기</span></div>
    <input type="file" id="file" accept="image/*" style="display:none">
  </div>

  <div class="card">
    <label>메인 문구</label>
    <input id="title" value="전주, 느리게 쉬다" maxlength="20">
    <label>서브 문구</label>
    <input id="sub" value="노송맨숀 · 전주 감성 숙소" maxlength="30">
    <label>태그 문구 (상단 작은 글씨)</label>
    <input id="tag" value="NOSONG MANSION" maxlength="24">

    <label>레이아웃</label>
    <div class="seg" id="segLayout">
      <button data-l="bottom" class="on">하단</button>
      <button data-l="center">중앙</button>
      <button data-l="top">상단</button>
    </div>

    <label>비율</label>
    <div class="seg" id="segRatio">
      <button data-r="45" class="on">4:5 (피드)</button>
      <button data-r="916">9:16 (스토리)</button>
      <button data-r="11">1:1</button>
    </div>

    <label>포인트 색</label>
    <div class="swatches" id="swatches"></div>
  </div>

  <div class="card">
    <canvas id="cv" width="1080" height="1350"></canvas>
    <div class="hint" id="hint">사진을 넣으면 바로 미리보기가 나와요. 글자만 바꿔도 즉시 반영됩니다.</div>
  </div>

  <button class="btn" id="save">포스터 저장 (PNG) ⬇️</button>
</div>
<div class="toast" id="toast"></div>

<script>
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var img=null;
var opt={layout:"bottom",ratio:"45",color:"#ffb400"};
var COLORS=["#ffb400","#ff6a95","#4a7bf7","#3ed07a","#ffffff","#ff6a3d"];
var RATIO={ "45":[1080,1350], "916":[1080,1920], "11":[1080,1080] };

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1500);}

/* swatches */
(function(){var box=document.getElementById('swatches');
  COLORS.forEach(function(c,i){var s=document.createElement('div');s.className="sw"+(i===0?" on":"");
    s.style.background=c;s.onclick=function(){[].forEach.call(box.children,function(x){x.classList.remove('on');});
      s.classList.add('on');opt.color=c;draw();};box.appendChild(s);});})();

function segBind(id,key){document.getElementById(id).addEventListener('click',function(e){
  if(e.target.tagName!=='BUTTON')return;[].forEach.call(this.children,function(b){b.classList.remove('on');});
  e.target.classList.add('on');opt[key]=e.target.dataset.l||e.target.dataset.r;draw();});}
segBind('segLayout','layout'); segBind('segRatio','ratio');

document.getElementById('drop').onclick=function(){document.getElementById('file').click();};
document.getElementById('file').onchange=function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){img=im;draw();
    document.getElementById('hint').textContent="좋아요! 글자/색/레이아웃을 바꿔보세요.";};im.src=r.result;};
  r.readAsDataURL(f);
};
['title','sub','tag'].forEach(function(id){document.getElementById(id).addEventListener('input',draw);});

function roundTag(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function wrap(text,x,y,maxW,lh,align){
  var words=text.split(' '),line='',lines=[];
  // 한국어는 공백이 적으므로 글자 단위 폴백
  if(words.length<=1){ // char wrap
    for(var i=0;i<text.length;i++){var test=line+text[i];
      if(ctx.measureText(test).width>maxW && line){lines.push(line);line=text[i];}else line=test;}
    if(line)lines.push(line);
  } else {
    for(var j=0;j<words.length;j++){var t=line?line+' '+words[j]:words[j];
      if(ctx.measureText(t).width>maxW && line){lines.push(line);line=words[j];}else line=t;}
    if(line)lines.push(line);
  }
  lines.forEach(function(l,i){ctx.fillText(l,x,y+i*lh);});
  return lines.length*lh;
}

function draw(){
  var dim=RATIO[opt.ratio];cv.width=dim[0];cv.height=dim[1];
  var W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  // 배경 이미지 cover
  if(img){
    var ir=img.width/img.height, cr=W/H, sw,sh,sx,sy;
    if(ir>cr){sh=img.height;sw=sh*cr;sx=(img.width-sw)/2;sy=0;}
    else{sw=img.width;sh=sw/cr;sx=0;sy=(img.height-sh)/2;}
    ctx.drawImage(img,sx,sy,sw,sh,0,0,W,H);
  } else {
    var g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,"#2b2440");g.addColorStop(1,"#5a4a7a");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle="rgba(255,255,255,.5)";ctx.textAlign="center";ctx.font="40px sans-serif";
    ctx.fillText("사진을 넣어주세요",W/2,H/2);
  }
  var title=document.getElementById('title').value;
  var sub=document.getElementById('sub').value;
  var tag=document.getElementById('tag').value;
  var pad=W*0.08;

  function scrim(top,bottom,dir){
    var gg=ctx.createLinearGradient(0,top,0,bottom);
    if(dir==="down"){gg.addColorStop(0,"rgba(0,0,0,0)");gg.addColorStop(1,"rgba(0,0,0,.72)");}
    else{gg.addColorStop(0,"rgba(0,0,0,.72)");gg.addColorStop(1,"rgba(0,0,0,0)");}
    ctx.fillStyle=gg;ctx.fillRect(0,top,W,bottom-top);
  }

  var baseY;
  if(opt.layout==="bottom"){scrim(H*0.5,H,"down");baseY=H-pad;ctx.textAlign="left";drawBlock(pad,baseY,"up");}
  else if(opt.layout==="top"){scrim(0,H*0.5,"up");ctx.textAlign="left";drawBlock(pad,pad+60,"down");}
  else{var gg=ctx.createLinearGradient(0,0,0,H);gg.addColorStop(0,"rgba(0,0,0,.35)");gg.addColorStop(.5,"rgba(0,0,0,.55)");gg.addColorStop(1,"rgba(0,0,0,.35)");
    ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);ctx.textAlign="center";drawBlock(W/2,H/2,"center");}

  function drawBlock(x,y,mode){
    var tsz=Math.round(W*0.085), ssz=Math.round(W*0.034), gsz=Math.round(W*0.028);
    ctx.shadowColor="rgba(0,0,0,.4)";ctx.shadowBlur=12;ctx.shadowOffsetY=2;
    if(mode==="up"){
      // sub below title, tag above; build upward
      ctx.font="700 "+ssz+"px -apple-system,sans-serif";ctx.fillStyle="#fff";
      ctx.fillText(sub,x,y);
      ctx.font="900 "+tsz+"px -apple-system,sans-serif";ctx.fillStyle="#fff";
      var th=wrapUp(title,x,y-ssz*1.6,W-pad*2,tsz*1.12);
      // tag
      ctx.shadowBlur=0;ctx.font="800 "+gsz+"px -apple-system,sans-serif";
      var tw=ctx.measureText(tag).width;
      ctx.fillStyle=opt.color;roundTag(x,y-ssz*1.6-th-gsz*2.4,tw+gsz*1.2,gsz*1.9,gsz);ctx.fill();
      ctx.fillStyle=contrast(opt.color);ctx.fillText(tag,x+gsz*0.6,y-ssz*1.6-th-gsz*1.05);
    } else if(mode==="down"){
      ctx.shadowBlur=0;ctx.font="800 "+gsz+"px -apple-system,sans-serif";
      var tw2=ctx.measureText(tag).width;ctx.fillStyle=opt.color;
      roundTag(x,y-gsz*1.4,tw2+gsz*1.2,gsz*1.9,gsz);ctx.fill();
      ctx.fillStyle=contrast(opt.color);ctx.fillText(tag,x+gsz*0.6,y);
      ctx.shadowColor="rgba(0,0,0,.4)";ctx.shadowBlur=12;
      ctx.font="900 "+tsz+"px -apple-system,sans-serif";ctx.fillStyle="#fff";
      var h2=wrap(title,x,y+tsz*1.3,W-pad*2,tsz*1.12,"left");
      ctx.font="700 "+ssz+"px -apple-system,sans-serif";ctx.fillText(sub,x,y+tsz*1.3+h2+ssz*0.3);
    } else { // center
      ctx.textAlign="center";
      ctx.shadowBlur=0;ctx.font="800 "+gsz+"px -apple-system,sans-serif";ctx.fillStyle=opt.color;
      ctx.fillText(tag,x,y-tsz*1.1);
      ctx.shadowColor="rgba(0,0,0,.45)";ctx.shadowBlur=14;
      ctx.font="900 "+tsz+"px -apple-system,sans-serif";ctx.fillStyle="#fff";
      var h3=wrapC(title,x,y,W-pad*2,tsz*1.12);
      ctx.font="700 "+ssz+"px -apple-system,sans-serif";ctx.fillText(sub,x,y+h3+ssz*0.6);
    }
    ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  }
  function wrapUp(text,x,yBottom,maxW,lh){
    var lines=splitLines(text,maxW);
    lines.forEach(function(l,i){ctx.fillText(l,x,yBottom-(lines.length-1-i)*lh);});
    return lines.length*lh;
  }
  function wrapC(text,xc,yc,maxW,lh){
    var lines=splitLines(text,maxW);var total=lines.length*lh;
    lines.forEach(function(l,i){ctx.fillText(l,xc,yc-total/2+lh*0.8+i*lh);});
    return total;
  }
  function splitLines(text,maxW){
    var line="",lines=[];
    for(var i=0;i<text.length;i++){var t=line+text[i];
      if(ctx.measureText(t).width>maxW && line){lines.push(line);line=text[i];}else line=t;}
    if(line)lines.push(line);return lines;
  }
}
function contrast(hex){
  var c=hex.replace('#','');if(c.length===3)c=c.split('').map(function(x){return x+x;}).join('');
  var r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  return (r*299+g*587+b*114)/1000>150?"#1a1a1a":"#ffffff";
}

document.getElementById('save').onclick=function(){
  if(!img){toast("먼저 사진을 넣어주세요");return;}
  var a=document.createElement('a');a.download="노송_포스터.png";a.href=cv.toDataURL("image/png");
  document.body.appendChild(a);a.click();a.remove();toast("저장됐어요 ⬇️");
};
draw();
</script>
</body>
</html>
