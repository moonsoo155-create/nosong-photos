<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1d33">
<title>NOSONG STUDIO</title>
<style>
  :root{
    --bg1:#0b1d33; --bg2:#13406b; --bg3:#2b7fb8;
    --ink:#ffffff; --sub:rgba(255,255,255,.72);
    --card:rgba(255,255,255,.14); --cardb:rgba(255,255,255,.28);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",
      "Malgun Gothic",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 80% at 50% -10%, #3aa0d8 0%, transparent 55%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 46%, var(--bg3) 100%);
    background-attachment:fixed;
    min-height:100dvh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:560px; margin:0 auto; padding:18px 20px 40px;}
  .statusbar{display:flex; justify-content:space-between; align-items:center;
    font-size:13px; font-weight:600; color:var(--sub); padding:4px 4px 14px;}
  header.brand{text-align:center; margin:6px 0 22px;}
  .brand .logo{display:inline-flex; align-items:center; gap:10px;
    font-weight:800; font-size:22px; letter-spacing:1px;}
  .brand .logo .mark{width:34px; height:34px; border-radius:10px;
    background:linear-gradient(145deg,#ffd27a,#ff9d5c); color:#3a2300;
    display:grid; place-items:center; font-size:18px; font-weight:900;}
  .brand .tag{margin-top:8px; font-size:13px; color:var(--sub);}
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px 10px;}
  @media (max-width:380px){ .grid{gap:16px 6px;} }
  a.app{text-decoration:none; color:var(--ink); display:flex; flex-direction:column;
    align-items:center; gap:7px;}
  .icon{width:100%; aspect-ratio:1/1; max-width:64px; border-radius:17px;
    display:grid; place-items:center; font-size:30px;
    box-shadow:0 6px 16px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .12s ease;}
  a.app:active .icon{transform:scale(.9);}
  .label{font-size:11.5px; line-height:1.25; text-align:center; font-weight:600;
    text-shadow:0 1px 3px rgba(0,0,0,.4); max-width:72px;}
  /* icon palettes */
  .g-blog{background:linear-gradient(145deg,#4a7bf7,#2b4fd0);}
  .g-msg{background:linear-gradient(145deg,#3ed07a,#1aa65a);}
  .g-review{background:linear-gradient(145deg,#ffcf4d,#ffa021);}
  .g-viral{background:linear-gradient(145deg,#ff6a95,#ff3d6e);}
  .g-rev{background:linear-gradient(145deg,#39c0c9,#1f8ca6);}
  .g-poster{background:linear-gradient(145deg,#b06bff,#7a3dd0);}
  .g-price{background:linear-gradient(145deg,#ff9a5a,#ff6a3d);}
  .g-clean{background:linear-gradient(145deg,#59d0f0,#2b8fd6);}
  .g-crm{background:linear-gradient(145deg,#8a94a6,#5a6676);}
  .dock{margin-top:30px; background:rgba(255,255,255,.12);
    border:1px solid var(--cardb); border-radius:22px; padding:12px 14px;}
  .dock h2{margin:0 0 6px; font-size:13px; color:var(--sub); font-weight:700;}
  .dock p{margin:0; font-size:12.5px; color:var(--sub); line-height:1.6;}
  .page-dots{display:flex; justify-content:center; gap:7px; margin:22px 0 4px;}
  .dot{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.35);}
  .dot.on{background:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <div class="statusbar">
    <span id="clock">—</span>
    <span>NOSONG ⌁ 📶 🔋</span>
  </div>

  <header class="brand">
    <div class="logo"><span class="mark">노</span> NOSONG STUDIO</div>
    <div class="tag">노송맨숀 · 노송별장 운영 자동화</div>
  </header>

  <nav class="grid">
    <a class="app" href="blog.html">
      <div class="icon g-blog">📝</div><div class="label">블로그 작성기</div></a>
    <a class="app" href="messages.html">
      <div class="icon g-msg">💬</div><div class="label">게스트 메시지</div></a>
    <a class="app" href="reviews.html">
      <div class="icon g-review">⭐</div><div class="label">리뷰 답글</div></a>
    <a class="app" href="viral.html">
      <div class="icon g-viral">🚀</div><div class="label">바이럴 변환기</div></a>
    <a class="app" href="revenue.html">
      <div class="icon g-rev">💰</div><div class="label">매출 관리</div></a>
    <a class="app" href="poster.html">
      <div class="icon g-poster">🖼️</div><div class="label">포스터 생성기</div></a>
    <a class="app" href="pricing.html">
      <div class="icon g-price">🧮</div><div class="label">가격 계산기</div></a>
    <a class="app" href="checklist.html">
      <div class="icon g-clean">🧹</div><div class="label">청소 체크리스트</div></a>
    <a class="app" href="guests.html">
      <div class="icon g-crm">📇</div><div class="label">게스트 CRM</div></a>
  </nav>

  <div class="page-dots"><span class="dot on"></span><span class="dot"></span></div>

  <div class="dock">
    <h2>이게 뭐예요?</h2>
    <p>사장님이 직접 쓰는 숙소 운영 자동화 9종을 모은 홈 화면입니다.
    아이콘을 누르면 각 도구가 바로 열립니다. 전부 설치·로그인 없이 돌아가고,
    입력한 내용은 이 기기 브라우저에만 저장돼요(localStorage). 핸드폰 홈 화면에
    추가하면 앱처럼 쓸 수 있습니다.</p>
  </div>
</div>
<script>
  function tick(){
    var d=new Date();
    var h=d.getHours(), m=d.getMinutes();
    document.getElementById('clock').textContent=
      (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
  }
  tick(); setInterval(tick,10000);
</script>
</body>
</html>
